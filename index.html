<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="ClearChoice — compare options with your own weighted criteria, privately in your browser.">
<meta name="theme-color" content="#0d9488">
<title>ClearChoice — Compare options, decide with confidence</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d9488'/%3E%3Cpath d='M9 16.5l5 5 9-11' stroke='white' stroke-width='3.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="app-header">
  <div class="header-inner">
    <a class="brand" href="#/decisions" id="brand-link" aria-label="ClearChoice home">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="28" height="28"><rect width="32" height="32" rx="7" fill="#0d9488"/><path d="M9 16.5l5 5 9-11" stroke="white" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      <span class="brand-name">ClearChoice</span>
    </a>
    <nav class="main-nav" aria-label="Main navigation">
      <a href="#/decisions" data-nav="decisions" class="nav-link">Decisions</a>
      <a href="#/guide" data-nav="guide" class="nav-link">Guide &amp; Privacy</a>
    </nav>
    <div class="header-actions">
      <button type="button" class="btn btn-ghost btn-sm" id="export-all-btn">Export all</button>
      <button type="button" class="btn btn-ghost btn-sm" id="import-all-btn">Import</button>
      <input type="file" id="import-file" accept="application/json,.json" class="visually-hidden" aria-label="Choose a ClearChoice backup file to import">
    </div>
  </div>
</header>

<main id="view" class="view" tabindex="-1"></main>

<footer class="app-footer">
  <p>ClearChoice stores everything in your browser only. No account, no backend; your decisions never leave this device unless you export a file.</p>
</footer>

<div id="dialog-root"></div>
<div id="toast-root" class="toast-root" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
